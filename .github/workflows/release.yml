name: Release

# Changesets-driven releases with npm provenance.
#
# 1. Land PRs on main with a changeset (`pnpm changeset`).
# 2. This workflow opens/updates a "Version Packages" PR that bumps versions and
#    writes CHANGELOGs.
# 3. Merging that PR publishes every changed @kroszborg/* package to npm with
#    provenance attestations (OIDC — no long-lived token needed if the packages
#    are configured for Trusted Publishing; otherwise set NPM_TOKEN).

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, build, test
        run: |
          pnpm lint
          pnpm typecheck
          pnpm build
          pnpm test

      - name: Version or publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          commit: 'release: version packages'
          title: 'release: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
